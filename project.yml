name: HenwayDispatch
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
targets:
  HenwayDispatch:
    type: application
    platform: iOS
    sources: [Source]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: studio.henway.dispatch
        INFOPLIST_KEY_CFBundleDisplayName: Henway Dispatch
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  HenwayDispatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HenwayDispatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.henway.dispatch.uitests
        TEST_TARGET_NAME: HenwayDispatch
schemes:
  HenwayDispatch:
    build:
      targets:
        HenwayDispatch: all
    test:
      targets:
        - HenwayDispatchUITests
